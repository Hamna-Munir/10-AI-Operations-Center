<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="AI Operations Center banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <circle cx="1450" cy="40" r="220" fill="#7c3aed" opacity="0.06"/>
  <circle cx="60" cy="480" r="200" fill="#2563eb" opacity="0.06"/>

  <!-- Logo -->
  <rect x="80" y="64" width="60" height="60" rx="16" fill="url(#brand)"/>
  <path d="M110 80 L128 112 H119 L110 96 L101 112 H92 Z" fill="#ffffff"/>
  <text x="158" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Automate · Manage · Grow</text>

  <!-- Title -->
  <text x="80" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="#0f172a">AI Operations</text>
  <text x="80" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="url(#brand)">Center</text>
  <text x="80" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#475569">AI-powered dashboard for tasks, workflows &amp; business automation</text>

  <!-- Chips -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="80" y="378" width="108" height="38" rx="19" fill="#ffffff" stroke="#dbe3f5"/>
    <text x="134" y="403" text-anchor="middle" fill="#2563eb">Python</text>
    <rect x="202" y="378" width="132" height="38" rx="19" fill="#ffffff" stroke="#dbe3f5"/>
    <text x="268" y="403" text-anchor="middle" fill="#2563eb">Streamlit</text>
    <rect x="348" y="378" width="130" height="38" rx="19" fill="#ffffff" stroke="#dbe3f5"/>
    <text x="413" y="403" text-anchor="middle" fill="#7c3aed">AI Agents</text>
    <rect x="492" y="378" width="132" height="38" rx="19" fill="#ffffff" stroke="#dbe3f5"/>
    <text x="558" y="403" text-anchor="middle" fill="#7c3aed">Workflows</text>
    <rect x="638" y="378" width="160" height="38" rx="19" fill="#ffffff" stroke="#dbe3f5"/>
    <text x="718" y="403" text-anchor="middle" fill="#0d9488">Human Approval</text>
  </g>
  <text x="80" y="456" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#64748b">Week 10 · AI Engineering Roadmap · Day 64–70</text>

  <!-- Dashboard card -->
  <g filter="url(#shadow)">
    <rect x="860" y="50" width="660" height="400" rx="24" fill="#ffffff"/>
  </g>
  <circle cx="892" cy="82" r="6" fill="#fca5a5"/>
  <circle cx="912" cy="82" r="6" fill="#fcd34d"/>
  <circle cx="932" cy="82" r="6" fill="#86efac"/>
  <text x="1488" y="87" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Dashboard</text>

  <!-- KPI tiles -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="890" y="112" width="190" height="96" rx="16" fill="#eff6ff"/>
    <text x="910" y="141" font-size="14" fill="#64748b">Total Tasks</text>
    <text x="910" y="184" font-size="38" font-weight="700" fill="#0f172a">12</text>
    <polyline points="1000,190 1020,180 1038,184 1062,166" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1100" y="112" width="190" height="96" rx="16" fill="#f5f3ff"/>
    <text x="1120" y="141" font-size="14" fill="#64748b">Workflows</text>
    <text x="1120" y="184" font-size="38" font-weight="700" fill="#0f172a">5</text>
    <polyline points="1210,190 1230,176 1248,182 1272,164" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1310" y="112" width="190" height="96" rx="16" fill="#f0fdfa"/>
    <text x="1330" y="141" font-size="14" fill="#64748b">Approvals</text>
    <text x="1330" y="184" font-size="38" font-weight="700" fill="#0f172a">3</text>
    <polyline points="1420,190 1440,184 1458,176 1482,166" fill="none" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Status bars -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#475569">
    <text x="890" y="246">Completed</text>
    <rect x="990" y="234" width="510" height="10" rx="5" fill="#e8edf7"/>
    <rect x="990" y="234" width="340" height="10" rx="5" fill="#14b8a6"/>
    <text x="890" y="276">In Progress</text>
    <rect x="990" y="264" width="510" height="10" rx="5" fill="#e8edf7"/>
    <rect x="990" y="264" width="250" height="10" rx="5" fill="#2563eb"/>
    <text x="890" y="306">Pending</text>
    <rect x="990" y="294" width="510" height="10" rx="5" fill="#e8edf7"/>
    <rect x="990" y="294" width="150" height="10" rx="5" fill="#7c3aed"/>
  </g>

  <!-- Workflow strip -->
  <line x1="890" y1="332" x2="1500" y2="332" stroke="#eef2f7" stroke-width="2"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">
    <circle cx="965" cy="374" r="24" fill="#eff6ff"/>
    <path d="M968 362 L957 377 H964 L962 388 L973 372 H966 Z" fill="#2563eb"/>
    <text x="965" y="428">Trigger</text>

    <circle cx="1135" cy="374" r="24" fill="#f5f3ff"/>
    <circle cx="1135" cy="374" r="9" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="1135" cy="374" r="3" fill="#7c3aed"/>
    <text x="1135" y="428">AI Agent</text>

    <circle cx="1305" cy="374" r="24" fill="#f0fdfa"/>
    <path d="M1296 374 L1303 381 L1315 366" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1305" y="428">Execute</text>

    <circle cx="1475" cy="374" r="24" fill="#fdf2f8"/>
    <path d="M1475 362 a8 8 0 0 1 8 8 v6 l4 5 h-24 l4 -5 v-6 a8 8 0 0 1 8 -8 Z" fill="#c026d3"/>
    <text x="1475" y="428">Notify</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M1005 374 H1090 M1083 368 L1090 374 L1083 380"/>
    <path d="M1175 374 H1260 M1253 368 L1260 374 L1253 380"/>
    <path d="M1345 374 H1430 M1423 368 L1430 374 L1423 380"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
